name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 用于创建/更新 GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Copy web assets into Android assets
        run: |
          mkdir -p app/src/main/assets
          cp -r www/* app/src/main/assets/

      - name: Set up Android SDK (manual, reliable)
        run: |
          SDK_ROOT=$HOME/android-sdk
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sS -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses
          sdkmanager --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle wrapper
        run: |
          curl -sS -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          mv gradle-8.9 gradle-dist
          gradle-dist/bin/gradle wrapper --gradle-version 8.9

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias bigmouse \
            -dname "CN=BigMouse, OU=Game, O=BigMouse, L=CN, ST=CN, C=CN" \
            -storepass android -keypass android

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore.jks
          KEYSTORE_PASS: android
          KEY_ALIAS: bigmouse
          KEY_PASS: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Upload APK to GitHub Release (公开下载)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 大嘴巴 v1.0.0
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact (备用)
        uses: actions/upload-artifact@v4
        with:
          name: bigmouse-release-apk
          path: app/build/outputs/apk/release/*.apk
