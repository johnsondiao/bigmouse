name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 用于创建/更新 GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 直接由 action 安装 Gradle（无需仓库内提交 gradle wrapper），
      # 与 shurufa 项目的 proven 配置一致。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ubuntu-latest 镜像已预装 Android SDK（ANDROID_HOME），
      # 因此无需再手动安装 SDK / build-tools / platform。
      - name: Copy web assets into Android assets
        run: |
          mkdir -p app/src/main/assets
          cp -r www/* app/src/main/assets/

      # release 用 AGP 自带的 debug 签名，产出可直接安装的 APK
      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK to GitHub Release (公开下载)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 大嘴巴 v1.0.0
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact (备用)
        uses: actions/upload-artifact@v4
        with:
          name: bigmouse-release-apk
          path: app/build/outputs/apk/release/*.apk
