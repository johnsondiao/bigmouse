plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bigmouse'
    compileSdk 34

    defaultConfig {
        applicationId "com.bigmouse"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // 签名配置：CI 里生成 keystore 并通过环境变量传入
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'release.keystore.jks')
            storePassword System.getenv('KEYSTORE_PASS') ?: 'android'
            keyAlias System.getenv('KEY_ALIAS') ?: 'bigmouse'
            keyPassword System.getenv('KEY_PASS') ?: 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
