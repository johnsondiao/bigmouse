plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bigmouse'
    compileSdk 34

    defaultConfig {
        applicationId "com.bigmouse"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "1.8.0"
    }

    // 复用 AGP 自带的 debug 签名来签 release，保证 CI 产出的 APK 可直接安装，
    // 无需 keytool / 环境变量（与 shurufa 项目的 proven 做法一致）。
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
